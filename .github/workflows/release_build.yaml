name: Release Oolite packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Build Oolite
      shell: msys2 {0}
      env:
        msystem: UCRT64
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
        echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc
        cp ~/.curlrc /c/Users/runneradmin/.curlrc 2>/dev/null || true
        ./install.sh clang

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job to clean up if ANYTHING fails
  cleanup-on-failure:
    needs: build-and-release
    if: failure()
    runs-on: ubuntu-latest # Faster/cheaper for simple API calls
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release delete "$TAG" --repo ${{ github.repository }} --cleanup-tag --yes
